[project]
name = "collector"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "shared",
    "packaging>=26.3",
    "pytest>=8.4.1",
    "typer>=0.27.0",
]

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
fetch = "collector.commands.fetch:app"
names = "collector.commands.names:app"
process = "collector.commands.process:app"
fake = "collector.fake:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
